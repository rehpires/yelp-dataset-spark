# Job de ingestao inicial / setup. Disparo manual (databricks bundle run yelp_pipeline).
# apply_ddl (catalogo, schemas, volumes, funcao de mascara) -> download_landing
# (kaggle -> Volumes) -> run_pipeline (DLT bronze/silver/gold) -> apply_grants
# (views comuns e GRANTs, que dependem das tabelas criadas pelo DLT).
#
# Divide o pipeline DLT com o job streaming_simulator; para nao haver overlap,
# os dois jobs aceitam uma execucao por vez e enfileiram as demais, e nenhum
# faz full refresh (que apagaria o estado do AUTO CDC e dos checkpoints).

resources:
  jobs:
    yelp_pipeline:
      name: yelp_dataset_pipeline
      max_concurrent_runs: 1
      queue:
        enabled: true

      tasks:
        - task_key: apply_ddl
          notebook_task:
            notebook_path: ${workspace.file_path}/src/apply_ddl
            base_parameters:
              ddl_paths: ${workspace.file_path}/DDL/create-catalog.sql,${workspace.file_path}/DCL/create-role.sql

        - task_key: download_landing
          depends_on:
            - task_key: apply_ddl
          notebook_task:
            notebook_path: ${workspace.file_path}/src/download_landing
          environment_key: kagglehub_env

        - task_key: run_pipeline
          depends_on:
            - task_key: download_landing
          pipeline_task:
            pipeline_id: ${resources.pipelines.yelp_dlt.id}
            full_refresh: false

        - task_key: apply_grants
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ${workspace.file_path}/src/apply_ddl
            base_parameters:
              ddl_paths: ${workspace.file_path}/DDL/create-views.sql,${workspace.file_path}/DCL/grants.sql

      environments:
        - environment_key: kagglehub_env
          spec:
            client: "2"
            dependencies:
              - kagglehub
